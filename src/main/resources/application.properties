spring.application.name=NHT

# =============================================
# DATABASE - MySQL (cPanel Shared Hosting)
# =============================================
# Remplacez ces valeurs par celles de votre cPanel (MySQL Databases)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parcour3_nht?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:parcour3_nht}
spring.datasource.password=${DB_PASSWORD:yackyra123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# SERVER
# =============================================
server.port=${PORT:8080}

# =============================================
# UPLOADS
# =============================================
file.upload-dir=uploads